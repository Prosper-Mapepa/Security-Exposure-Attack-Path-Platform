name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: seap
          POSTGRES_PASSWORD: seap
          POSTGRES_DB: seap
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U seap"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://seap:seap@localhost:5432/seap?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: ci-access-secret
      MFA_ENCRYPTION_KEY: ci-mfa-key
      SCAN_PATH_ALLOWLIST: .
      FAIL_ON: HIGH
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run db:deploy
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Install security scanners
        run: |
          pip install semgrep
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sudo sh -s -- -b /usr/local/bin v0.58.1
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v8.24.2/gitleaks_8.24.2_linux_x64.tar.gz" | sudo tar -xz -C /usr/local/bin gitleaks
      - name: SAST, secrets, and dependency scan
        run: |
          mkdir -p security-artifacts
          semgrep scan --config packages/scanner-adapters/rules --json --quiet --metrics=off --exclude lab --exclude tests/fixtures . > security-artifacts/semgrep.json || true
          gitleaks detect --source . --config .gitleaks.toml --report-format json --report-path security-artifacts/gitleaks.json --no-banner --exit-code 0 || true
          trivy fs --format json --output security-artifacts/trivy.json --scanners vuln --skip-dirs lab --skip-dirs tests/fixtures --skip-dirs node_modules . || true
      - name: Security gate
        run: node scripts/security-gate.mjs security-artifacts
