apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: seap
  namespace: seap
spec:
  rules:
    - host: seap.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: seap-api
                port:
                  number: 4000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: seap-web
                port:
                  number: 80
